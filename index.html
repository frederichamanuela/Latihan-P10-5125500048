<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Karya MMB — Kode Latihan P10</title>
     <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="assets/logo.svg" alt="Logo Katalog Karya" width="32" height="32">
        Katalog Karya
      </a>
    </div>
  </nav>
 
  <main class="container py-4">
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-6">
        <input id="cari" class="form-control" type="search" placeholder="Cari judul karya…" aria-label="Cari judul karya">
      </div>
      <div class="col-12 col-md-6">
        <select id="filterKategori" class="form-select" aria-label="Filter kategori">
          <option value="semua">Semua kategori</option>
          <option value="Animasi">Animasi</option>
          <option value="Video">Video</option>
          <option value="Desain">Desain</option>
        </select>
      </div>
    </div>
    <p id="jumlah" class="text-secondary"></p>
    <div id="galeri" class="row g-3"></div>
    <div id="detail" class="alert alert-info mt-4" hidden></div>
  </main>
 
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
